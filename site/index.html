<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Semantic layer page: design prototypes</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { display: flex; flex-direction: column; font: 14px/1.4 system-ui, sans-serif; background: #0f0f0e; color: #e7e5e4; }
  nav { display: flex; align-items: center; gap: 6px; padding: 8px 12px; border-bottom: 1px solid #2a2a28; }
  nav b { margin-right: 12px; font-weight: 600; }
  nav button { height: 32px; padding: 0 14px; border-radius: 999px; border: 1px solid #3a3a37; background: transparent; color: #d6d3d1; cursor: pointer; font: inherit; }
  nav button[aria-pressed="true"] { background: #e7e5e4; color: #0f0f0e; border-color: #e7e5e4; }
  nav .hint { margin-left: auto; color: #8a8782; font-size: 12px; }
  nav a { color: #8ab4f0; font-size: 12px; margin-left: 12px; }
  iframe { flex: 1; border: 0; width: 100%; background: #fff; }
</style>
</head>
<body>
<nav>
  <b>Prototypes</b>
  <button data-src="a-guide.html">A. Field guide</button>
  <button data-src="b-matrix.html">B. Can I semantic?</button>
  <button data-src="c-map.html">C. Stack map</button>
  <button data-src="hub.html">D. Semantic Context Index</button>
  <span class="hint">Keys 1 to 4 switch. Throwaway prototype.</span>
  <a id="open" href="a-guide.html" target="_blank">Open in new tab</a>
</nav>
<iframe id="f" title="Design prototype"></iframe>
<script>
const btns = [...document.querySelectorAll('nav button')];
function show(i) {
  btns.forEach((b, k) => b.setAttribute('aria-pressed', k === i));
  document.getElementById('f').src = btns[i].dataset.src;
  document.getElementById('open').href = btns[i].dataset.src;
  history.replaceState(null, '', '#' + 'abcd'[i]);
}
btns.forEach((b, i) => (b.onclick = () => show(i)));
addEventListener('keydown', (e) => { const i = '1234'.indexOf(e.key); if (i >= 0) show(i); });
show(Math.max(0, 'abcd'.indexOf(location.hash.slice(1))));
</script>
</body>
</html>
